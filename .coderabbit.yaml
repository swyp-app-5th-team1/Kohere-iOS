language: ko-KR

tone_instructions: |
  iOS 엔지니어링 관점에서 깔끔하고 담백한 톤으로 피드백해줘. 
  친근함은 유지하되, 무엇이 문제이고 어떻게 수정해야 하는지 핵심 위주로 명확하게 짚어줘.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  review_status: true
  commit_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  poem: false

  path_instructions:
    # [공통] Swift 및 SwiftUI 기본 관례
    - path: "**/*.swift"
      instructions: |
        강제 언래핑(!), try!, as! 사용을 지양하고 guard let, if let을 활용한 안전한 바인딩을 권장하세요.
        Apple의 Swift API Design Guidelines를 준수하고 명확한 네이밍을 제안하세요.
        Combine 사용 시 [weak self] 및 .store(in: &cancellables) 누락으로 인한 메모리 누수를 점검하세요.
        하드코딩된 시크릿 키나 API Base URL이 있다면 Resource 레이어의 .xcconfig 환경변수로 분리하도록 안내하세요.

    # [App] 최상위 초기화 및 루트 컨텍스트
    - path: "**/App/**/*.swift"
      instructions: |
        App 레이어는 앱의 엔트리 포인트 및 Root Reducer를 관리하는 최상위 영역입니다.
        앱 전역의 상태 초기화 및 생명주기 제어가 안전하게 처리되는지 확인하세요.

    # [Presentation] UI 및 상태 관리 레이어 (SwiftUI + TCA)
    - path: "**/Presentation/**/*.swift"
      instructions: |
        Presentation 레이어는 SwiftUI View와 TCA Reducer로 구성됩니다. 아래 규칙을 엄격히 검증하세요.
        1. View-Reducer 역할 분리: View는 State 렌더링과 Action 전송만 담당해야 하며, 비즈니스 로직이나 Side Effect 처리는 반드시 Reducer의 Body(Effect)에서 이뤄져야 합니다.
        2. SwiftUI Navigation Convention 준수 여부:
           - 일반 View는 Router를 직접 주입받아 사용하면 안 됩니다. 화면 전환 액션은 반드시 클로저 형태로 상위 계층에 위임해야 합니다.
           - 각 기능별 FlowView가 NavigationStack(path:)과 navigationDestination(for:)을 사용해 화면 전환 및 Route 지정을 집중 관리하는지 확인하세요.
           - Route는 Hashable을 채택한 enum으로 안전하게 정의되어야 합니다.

    # [Domain] 순수 비즈니스 로직 레이어 (Entity, UseCase, Interface)
    - path: "**/Domain/**/*.swift"
      instructions: |
        Domain 레이어는 서비스의 핵심 비즈니스 로직이며, 외부 라이브러리나 UI 프레임워크에 의존하지 않는 가장 순수한 영역이어야 합니다.
        1. 외부 의존성 차단: import SwiftUI, import Alamofire 등 Presentation/Data 레이어와 관련된 라이브러리가 절대로 수입(import)되지 않았는지 확인하세요. (Foundation 라이브러리 중심의 순수 Swift 코드로만 구성되어야 합니다.)
        2. UseCase 설계: 단일 책임 원칙(SRP)을 따라 하나의 주요 비즈니스 흐름만 처리해야 하며, UseCaseDependencies를 통해 TCA Dependency에 정상 등록되었는지 검증하세요.
        3. Interfaces 구조: Interfaces 폴더 안의 Repository는 의존성 역전(DIP)을 위해 오직 프로토콜(Protocol)로만 정의되어 있어야 합니다.

    # [Data] 데이터 소스 및 네트워크 통신 레이어 (Repository, Network)
    - path: "**/Data/**/*.swift"
      instructions: |
        Data 레이어는 네트워크 통신(Alamofire 기반) 및 데이터 소스 관리를 담당합니다.
        1. Network 구조 준수: Network/Core 하위의 NetworkService를 활용하여 공통 응답 포맷(BaseResponseDTO) 기반의 제네릭 디코딩이 안전하게 수행되는지 확인하세요.
        2. 데이터 변환(Mapping): 각 도메인별 폴더 내의 ResponseDTO가 Domain 레이어의 순수 Entity(구조체)로 올바르게 맵핑되어 반환되는지 점검하세요.
        3. 에러 핸들링: 통신 실패나 디코딩 에러 발생 시, Network/Error 하위에 정의된 도메인별 에러(ex: HomeError)로 명확하게 변환하여 상위 레이어로 전달하는지 확인하세요.

    # [Resource] 앱 리소스 및 환경 설정
    - path: "**/Resource/**/*"
      instructions: |
        .xcconfig 환경 변수 설정, Assets, Info.plist 등을 관리하는 영역입니다. 환경별 변수 관리가 적절한지 검증하세요.

  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "draft"
    drafts: false
    base_branches:
      - "dev"

finishing_touches:
  docstrings:
    enabled: true

chat:
  auto_reply: true

code_generation:
  docstrings:
    language: "ko-KR"
